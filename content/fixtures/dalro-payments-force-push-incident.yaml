  - message: |
      fix(payment): 게이트웨이 코드 매핑 보정

      일부 해외 카드사가 만료월을 0-11 범위로 보내와 12월 카드가 만료로
      처리되고 있었습니다. 게이트웨이 코드로 0-based 여부를 판별해
      보정합니다.

      Refs: PAY-247
    reason: 리베이스 전 hotfix/PAY-247-expiry-zero-based의 커밋. 강제 푸시로 브랜치에서 떨어져 나감
    files:
      src/payment/ExpiryMonth.ts: |
        import type { Card } from './PaymentRequest'

        /** 만료월을 0-11로 보내오는 게이트웨이 코드. 카드사 연동 문서 기준. */
        const ZERO_BASED_GATEWAYS = new Set(['GW_EU_01', 'GW_EU_04', 'GW_SEA_02'])

        export interface NormalizedExpiry {
          month: number
          year: number
        }

        export function normalizeExpiry(card: Card): NormalizedExpiry {
          const zeroBased = ZERO_BASED_GATEWAYS.has(card.issuerCode) && card.expiryMonth <= 11
          return {
            month: zeroBased ? card.expiryMonth + 1 : card.expiryMonth,
            year: card.expiryYear,
          }
        }

        export function isExpired(card: Card, now: Date): boolean {
          const { month, year } = normalizeExpiry(card)
          const lastMoment = new Date(year, month, 0, 23, 59, 59)
          return now > lastMoment
        }

  - message: |
      test(payment): 0-based 만료월 경계 테스트 추가

      Refs: PAY-247
    reason: 리베이스 전 hotfix/PAY-247-expiry-zero-based의 마지막 커밋. 강제 푸시로 브랜치에서 떨어져 나감
    files:
      src/payment/__tests__/expiry-boundary.test.ts: |
        import { test } from 'node:test'
        import assert from 'node:assert/strict'
        import { normalizeExpiry, isExpired } from '../ExpiryMonth'
        import type { Card } from '../PaymentRequest'

        const card = (over: Partial<Card> = {}): Card => ({
          bin: '433012',
          last4: '9921',
          expiryMonth: 11,
          expiryYear: 2026,
          issuerCode: 'GW_EU_01',
          ...over,
        })

        test('0-based 게이트웨이의 11은 12월로 읽는다', () => {
          assert.equal(normalizeExpiry(card()).month, 12)
        })

        test('1-based 게이트웨이의 11은 그대로 11월이다', () => {
          assert.equal(normalizeExpiry(card({ issuerCode: 'KB' })).month, 11)
        })

        test('보정된 12월 카드는 12월 말일까지 살아 있다', () => {
          assert.equal(isExpired(card(), new Date(2026, 11, 31, 23, 0, 0)), false)
        })

        test('보정된 12월 카드도 해가 바뀌면 만료다', () => {
          assert.equal(isExpired(card(), new Date(2027, 0, 1, 0, 0, 1)), true)
        })

