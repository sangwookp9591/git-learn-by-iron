      Refs: PAY-247
    reason: 리베이스 전 hotfix/PAY-247-expiry-zero-based의 커밋. 강제 푸시로 브랜치에서 떨어져 나감
    files:
      src/payment/ExpiryMonth.ts: |
        import type { Card } from './PaymentRequest'

        /** 카드사가 보내온 만료월을 1-12 범위로 해석한 결과. */
        export interface NormalizedExpiry {
          month: number
          year: number
        }

        export function normalizeExpiry(card: Card): NormalizedExpiry {
          return { month: card.expiryMonth, year: card.expiryYear }
        }

        export function isExpired(card: Card, now: Date): boolean {
          const { month, year } = normalizeExpiry(card)
          const lastMoment = new Date(year, month, 0, 23, 59, 59)
          return now > lastMoment
        }
      src/payment/PaymentValidator.ts: |
        import type { PaymentRequest, ValidationResult } from './PaymentRequest'
        import { isExpired } from './ExpiryMonth'

        const MIN_AMOUNT = 100
        const MAX_AMOUNT = 10_000_000

        export class PaymentValidator {
          validate(req: PaymentRequest, now: Date = new Date()): ValidationResult {
            if (req.amount < MIN_AMOUNT || req.amount > MAX_AMOUNT) {
              return { ok: false, code: 'AMOUNT_OUT_OF_RANGE', message: '결제 금액이 허용 범위를 벗어났습니다' }
            }
            if (isExpired(req.card, now)) {
              return { ok: false, code: 'CARD_EXPIRED', message: '만료된 카드입니다' }
            }
