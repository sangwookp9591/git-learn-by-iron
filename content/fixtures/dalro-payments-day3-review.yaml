id: dalro-payments-day3-review
description: 3일차 오후. MR을 올렸고 DEREK 님이 "커밋 좀 나눠주실 수 있을까요"라고 했다. 브랜치 커밋 두 개 중 최신 커밋에 검증 로직과 에러 응답 변경이 같이 들어 있다.
branch: feature/PAY-231-card-expiry

# remote.branches.<이름>.at 은 origin 쪽 브랜치가 가리키는 지점이다.
# 'head'는 로컬과 같은 지점, 그 외에는 아래 commits 중 한 커밋의 제목 줄을 적는다.
# main 이 어디서 끝나고 피처 브랜치가 어디서 시작하는지가 이 값으로 정해진다.

commits:
  - message: |
      feat(payment): 결제 요청 스키마와 게이트웨이 클라이언트 추가

      Refs: PAY-118
    files:
      src/payment/PaymentRequest.ts: |
        export type Currency = 'KRW' | 'USD' | 'JPY'

        export interface Card {
          bin: string
          last4: string
          expiryMonth: number
          expiryYear: number
          issuerCode: string
        }

        export interface PaymentRequest {
          orderId: string
          amount: number
          currency: Currency
          card: Card
          idempotencyKey: string
        }

        export interface ValidationResult {
          ok: boolean
          code?: string
          message?: string
        }
      src/payment/gateway/GatewayClient.ts: |
        import type { PaymentRequest } from '../PaymentRequest'

        export interface GatewayResponse {
          approved: boolean
          approvalNumber?: string
          declineCode?: string
        }

        export class GatewayClient {
          constructor(
            private readonly baseUrl: string,
            private readonly timeoutMs: number,
          ) {}

          async authorize(req: PaymentRequest): Promise<GatewayResponse> {
            const res = await fetch(`${this.baseUrl}/authorizations`, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'idempotency-key': req.idempotencyKey,
              },
              body: JSON.stringify(req),
              signal: AbortSignal.timeout(this.timeoutMs),
            })
            return (await res.json()) as GatewayResponse
          }
        }
      config/payment.yml: |
        gateway:
          baseUrl: https://gw.dalro.example/v2
          timeoutMs: 3000
          retry:
            maxAttempts: 3
            backoffMs: 200

        limits:
          minAmount: 100
          maxAmount: 10000000
      .gitignore: |
        node_modules/
        dist/
        *.log
        .DS_Store
        .env.local

  - message: |
      feat(payment): 결제 요청 검증기 골격 추가

      Refs: PAY-140
    files:
      src/payment/PaymentValidator.ts: |
        import type { PaymentRequest, ValidationResult } from './PaymentRequest'

        const MIN_AMOUNT = 100
        const MAX_AMOUNT = 10_000_000

        export class PaymentValidator {
          validate(req: PaymentRequest): ValidationResult {
            if (!req.orderId) {
              return { ok: false, code: 'ORDER_ID_REQUIRED', message: '주문 번호가 없습니다' }
            }
            if (req.amount < MIN_AMOUNT || req.amount > MAX_AMOUNT) {
              return { ok: false, code: 'AMOUNT_OUT_OF_RANGE', message: '결제 금액이 허용 범위를 벗어났습니다' }
            }
            if (!req.idempotencyKey) {
              return { ok: false, code: 'IDEMPOTENCY_KEY_REQUIRED', message: '멱등성 키가 없습니다' }
            }
            return { ok: true }
          }
        }

  - message: |
      feat(payment): 결제 승인 컨트롤러 추가

      Refs: PAY-140
    files:
      src/payment/PaymentController.ts: |
        import { PaymentValidator } from './PaymentValidator'
        import { GatewayClient } from './gateway/GatewayClient'
        import type { PaymentRequest } from './PaymentRequest'

        export interface HttpResponse {
          status: number
          body: unknown
        }

        export class PaymentController {
          constructor(
            private readonly validator: PaymentValidator,
            private readonly gateway: GatewayClient,
          ) {}

          async authorize(req: PaymentRequest): Promise<HttpResponse> {
            const validation = this.validator.validate(req)
            if (!validation.ok) {
              return { status: 422, body: { code: validation.code, message: validation.message } }
            }

            const result = await this.gateway.authorize(req)
            if (!result.approved) {
              return { status: 402, body: { code: result.declineCode } }
            }
            return { status: 200, body: { approvalNumber: result.approvalNumber } }
          }
        }

  # ---- 여기부터 feature/PAY-231-card-expiry 브랜치 ----

  - message: |
      test(payment): 카드 만료일 경계 테스트 추가

      만료월 말일 23:59까지는 통과하고 그 다음 초부터 거절되어야
      한다는 걸 먼저 고정해 둡니다. 구현은 다음 커밋입니다.

      Refs: PAY-231
    files:
      src/payment/__tests__/validator.test.ts: |
        import { test } from 'node:test'
        import assert from 'node:assert/strict'
        import { PaymentValidator } from '../PaymentValidator'
        import type { PaymentRequest } from '../PaymentRequest'

        const request = (over: Partial<PaymentRequest> = {}): PaymentRequest => ({
          orderId: 'ORD-20260915-0042',
          amount: 12_900,
          currency: 'KRW',
          card: { bin: '433012', last4: '9921', expiryMonth: 7, expiryYear: 2027, issuerCode: 'KB' },
          idempotencyKey: 'a1f2-c390',
          ...over,
        })

        const expiring = (month: number, year: number) => ({
          bin: '433012', last4: '9921', expiryMonth: month, expiryYear: year, issuerCode: 'KB',
        })

        test('만료월 말일 23시까지는 통과한다', () => {
          const result = new PaymentValidator().validate(request({ card: expiring(7, 2026) }), new Date(2026, 6, 31, 23, 0, 0))
          assert.equal(result.ok, true)
        })

        test('만료월이 지나면 거절한다', () => {
          const result = new PaymentValidator().validate(request({ card: expiring(7, 2026) }), new Date(2026, 7, 1, 0, 0, 1))
          assert.equal(result.code, 'CARD_EXPIRED')
        })

  - message: |
      feat(payment): 카드 만료일 검증 추가

      Refs: PAY-231
    files:
      src/payment/PaymentValidator.ts: |
        import type { Card, PaymentRequest, ValidationResult } from './PaymentRequest'

        const MIN_AMOUNT = 100
        const MAX_AMOUNT = 10_000_000

        export class PaymentValidator {
          validate(req: PaymentRequest, now: Date = new Date()): ValidationResult {
            if (!req.orderId) {
              return { ok: false, code: 'ORDER_ID_REQUIRED', message: '주문 번호가 없습니다' }
            }
            if (req.amount < MIN_AMOUNT || req.amount > MAX_AMOUNT) {
              return { ok: false, code: 'AMOUNT_OUT_OF_RANGE', message: '결제 금액이 허용 범위를 벗어났습니다' }
            }
            if (!req.idempotencyKey) {
              return { ok: false, code: 'IDEMPOTENCY_KEY_REQUIRED', message: '멱등성 키가 없습니다' }
            }
            if (this.isExpired(req.card, now)) {
              return { ok: false, code: 'CARD_EXPIRED', message: '만료된 카드입니다' }
            }
            return { ok: true }
          }

          private isExpired(card: Card, now: Date): boolean {
            const lastMoment = new Date(card.expiryYear, card.expiryMonth, 0, 23, 59, 59)
            return now > lastMoment
          }
        }
      src/payment/PaymentController.ts: |
        import { PaymentValidator } from './PaymentValidator'
        import { GatewayClient } from './gateway/GatewayClient'
        import type { PaymentRequest } from './PaymentRequest'

        export interface HttpResponse {
          status: number
          body: unknown
        }

        const CLIENT_FAULT_CODES = new Set(['CARD_EXPIRED', 'AMOUNT_OUT_OF_RANGE', 'ORDER_ID_REQUIRED'])

        export class PaymentController {
          constructor(
            private readonly validator: PaymentValidator,
            private readonly gateway: GatewayClient,
          ) {}

          async authorize(req: PaymentRequest): Promise<HttpResponse> {
            const validation = this.validator.validate(req)
            if (!validation.ok) {
              const status = CLIENT_FAULT_CODES.has(validation.code ?? '') ? 400 : 422
              return { status, body: { code: validation.code, message: validation.message } }
            }

            const result = await this.gateway.authorize(req)
            if (!result.approved) {
              return { status: 402, body: { code: result.declineCode } }
            }
            return { status: 200, body: { approvalNumber: result.approvalNumber } }
          }
        }

