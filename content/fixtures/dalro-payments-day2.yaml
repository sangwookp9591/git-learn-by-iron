        - message: |
            refactor(settlement): 정산 금액 계산을 도메인 서비스로 분리

            컨트롤러에 흩어져 있던 수수료 계산을 SettlementCalculator로
            모았습니다. 동작은 그대로입니다.

            Refs: PAY-201
          files:
            src/settlement/SettlementCalculator.ts: |
              export interface SettlementInput {
                amount: number
                feeRate: number
                issuerCode: string
              }

              const ISSUER_SURCHARGE: Record<string, number> = {
                KB: 0,
                SHINHAN: 0,
                AMEX: 0.004,
              }

              export class SettlementCalculator {
                calculate({ amount, feeRate, issuerCode }: SettlementInput): number {
                  const surcharge = ISSUER_SURCHARGE[issuerCode] ?? 0
                  const fee = Math.round(amount * (feeRate + surcharge))
                  return amount - fee
                }
              }

        - message: |
            fix(webhook): 재시도 시 중복 승인되던 문제 수정

            게이트웨이가 같은 승인 웹훅을 두 번 보내면 결제가 두 번
            확정되고 있었습니다. 승인 번호로 멱등 처리합니다.

            Refs: PAY-208
          files:
            src/webhook/WebhookHandler.ts: |
              export interface ApprovalEvent {
                approvalNumber: string
                orderId: string
                amount: number
              }

              export class WebhookHandler {
                private readonly handled = new Set<string>()

                handleApproval(event: ApprovalEvent): 'applied' | 'duplicated' {
                  if (this.handled.has(event.approvalNumber)) {
                    return 'duplicated'
                  }
                  this.handled.add(event.approvalNumber)
                  return 'applied'
                }
              }

